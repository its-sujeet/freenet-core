<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Freenet Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #e0e0e0; padding: 16px; }
  h1 { font-size: 20px; margin-bottom: 16px; color: #00bcd4; }
  .stat { background: #16213e; border-radius: 8px; padding: 12px; margin-bottom: 8px; }
  .stat-label { font-size: 12px; color: #888; }
  .stat-value { font-size: 16px; font-weight: bold; margin-top: 2px; font-family: monospace; }
  .connected { color: #4caf50; }
  .disconnected { color: #f44336; }
  #log { background: #0f0f23; border-radius: 8px; padding: 12px; margin-top: 12px; font-family: monospace; font-size: 11px; max-height: 200px; overflow-y: auto; }
  .log-entry { padding: 2px 0; border-bottom: 1px solid #1a1a2e; }
  .log-time { color: #666; margin-right: 8px; }
  .log-info { color: #00bcd4; }
  .log-error { color: #f44336; }
  .log-warn { color: #ff9800; }
</style>
</head>
<body>
  <h1>⚡ Freenet Node</h1>
  <div class="stat">
    <div class="stat-label">Status</div>
    <div class="stat-value" id="status">Disconnected</div>
  </div>
  <div class="stat">
    <div class="stat-label">Peer ID</div>
    <div class="stat-value" id="peerId">—</div>
  </div>
  <div class="stat">
    <div class="stat-label">Contracts</div>
    <div class="stat-value" id="contracts">0</div>
  </div>
  <div class="stat">
    <div class="stat-label">Uptime</div>
    <div class="stat-value" id="uptime">—</div>
  </div>
  <h2 style="font-size:14px;margin-top:16px;color:#888;">Live Log</h2>
  <div id="log"></div>
  <script>
    const statusEl = document.getElementById('status');
    const peerIdEl = document.getElementById('peerId');
    const contractsEl = document.getElementById('contracts');
    const uptimeEl = document.getElementById('uptime');
    const logEl = document.getElementById('log');

    function addLog(level, msg) {
      const div = document.createElement('div');
      div.className = 'log-entry';
      const time = new Date().toLocaleTimeString();
      div.innerHTML = `<span class="log-time">${time}</span><span class="log-${level}">[${level}] ${msg}</span>`;
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function connect(wsUrl) {
      addLog('info', 'Connecting to ' + wsUrl + '...');
      const ws = new WebSocket(wsUrl);
      ws.onopen = () => {
        statusEl.textContent = 'Connected';
        statusEl.className = 'stat-value connected';
        addLog('info', 'WebSocket connected');
        ws.send(JSON.stringify({ type: 'subscribe', channel: 'status' }));
      };
      ws.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          if (msg.type === 'status') {
            if (msg.peer_id) peerIdEl.textContent = msg.peer_id;
            if (msg.contract_count !== undefined) contractsEl.textContent = msg.contract_count;
            if (msg.uptime) uptimeEl.textContent = msg.uptime;
          } else if (msg.type === 'log') {
            addLog(msg.level || 'info', msg.message);
          }
        } catch {
          addLog('info', 'WS: ' + e.data);
        }
      };
      ws.onerror = () => {
        statusEl.textContent = 'Error';
        statusEl.className = 'stat-value disconnected';
        addLog('error', 'WebSocket error');
      };
      ws.onclose = () => {
        statusEl.textContent = 'Disconnected';
        statusEl.className = 'stat-value disconnected';
        addLog('warn', 'WebSocket closed, reconnecting in 3s...');
        setTimeout(() => {
          const url = document.getElementById('freenet-ws-url')?.getAttribute('data-url');
          if (url) connect(url);
        }, 3000);
      };
    }

    // Listen for the URL to be injected
    window.addEventListener('message', (e) => {
      if (e.data && e.data.wsUrl) {
        const el = document.getElementById('freenet-ws-url');
        if (el) el.setAttribute('data-url', e.data.wsUrl);
        connect(e.data.wsUrl);
      }
    });

    // Check if URL was injected as attribute
    const urlEl = document.getElementById('freenet-ws-url');
    if (urlEl && urlEl.getAttribute('data-url')) {
      connect(urlEl.getAttribute('data-url'));
    }
  </script>
</body>
</html>
