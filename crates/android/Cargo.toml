[package]
name = "freenet-android"
version = "0.2.112"
edition = "2021"
description = "Freenet Android native library — headless P2P node for mobile"

[lib]
name = "freenet_android"
crate-type = ["cdylib"]

[dependencies]
# Core Freenet lib (workspace neighbor)
freenet = { path = "../core" }

# JNI bindings for Android
jni = { version = "0.21", features = ["invocation"] }

# Async runtime — same versions as freenet-core workspace
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"

# Hex encoding for KEK
hex = "0.4"
